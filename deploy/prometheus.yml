global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "marketdata-api"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "marketdata-api"
  - job_name: "marketdata-worker"
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: "marketdata-worker"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]